# 在 GitHub 上自动构建 Windows exe（无需本地装 Python）
name: Build Windows exe

on:
  workflow_dispatch:   # 手动触发
  push:
    paths:
      - 'deepseek_balance_widget.py'
      - 'assets/icon.ico'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build exe
        run: pyinstaller --noconfirm --clean --onefile --windowed --icon assets/icon.ico --name "DeepSeekBalance" deepseek_balance_widget.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekBalance-Windows
          path: dist/DeepSeekBalance.exe
